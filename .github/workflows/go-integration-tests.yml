name: Go integration tests

# Runs for changes to Go code, docs, or this workflow, and can be dispatched from any branch.
on:
  pull_request:
    branches: [master]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      # The "Test examples" step checks the snippets of the docs.
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/go-integration-tests.yml'
      - '.github/scripts/assert-tests-ran.sh'
  workflow_dispatch:

# Runs of one ref share the test account, so they must not overlap.
concurrency:
  group: go-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Earlier releases trust compromised CA certificates. Keep in step with go.mod.
          go-version: '1.26.10'
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Lint (golangci-lint)
        # .golangci.yml uses the v2 schema, which needs the v7 action.
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0

      - name: Build
        run: go build ./...

      - name: Unit tests
        # Offline tests with a mock HTTP backend.
        run: go test . -v

      # Without the token the integration tests skip and the run would be green.
      - name: Require APIFY_TOKEN secret
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          if [ -z "${APIFY_TOKEN}" ]; then
            echo "::error::APIFY_TOKEN secret is empty or missing; integration tests would not run against the API."
            exit 1
          fi

      - name: Integration tests
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        # The example and snippet tests run in "Test examples". assert-tests-ran.sh fails the step
        # if no test ran or all were skipped.
        run: |
          set -o pipefail
          go test ./tests/ -json -timeout 900s -p 1 -parallel 4 -skip '^(TestExample|TestDocSnippets)' \
            | tee integration.jsonl
          ./.github/scripts/assert-tests-ran.sh integration.jsonl "Integration tests"

      # Runs the programs in examples/ against the live API and compiles the snippets of the docs.
      - name: Test examples
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          set -o pipefail
          go test ./tests/ -json -timeout 900s -p 1 -parallel 4 -run '^(TestExample|TestDocSnippets)' \
            | tee examples.jsonl
          ./.github/scripts/assert-tests-ran.sh examples.jsonl "Test examples"

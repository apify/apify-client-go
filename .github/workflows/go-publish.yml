name: Publish Go client

# Publishes the Go client by pushing the tag v<ClientVersion>, which the Go module proxy and
# pkg.go.dev pick up. It runs only when a maintainer triggers it.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run all checks but do not create/push the tag or trigger indexing.'
        type: boolean
        default: false

# Two release tags pushed at once are hard to undo.
concurrency:
  group: go-publish
  cancel-in-progress: false

# The GITHUB_TOKEN pushes the tag and creates the release. No other credentials are needed.
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, so that the tag points at the real commit.
          fetch-depth: 0

      # A tag is immutable once the module proxy has fetched it, so release from master only.
      - name: Require master branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/master" ]; then
            echo "::error::Publishing is only allowed from master, but this run is on '${GITHUB_REF}'."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Earlier releases trust compromised CA certificates. Keep in step with go.mod.
          go-version: '1.26.10'
          cache: true

      # The checks of CI.
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0

      - name: Build
        run: go build ./...

      - name: Unit tests
        # Offline tests with a mock HTTP backend.
        run: go test . -v

      # The tag is the ClientVersion of version.go.
      - name: Resolve version from version.go
        id: version
        run: |
          version=$(sed -n 's/^const ClientVersion = "\(.*\)"$/\1/p' version.go)
          if [ -z "${version}" ]; then
            echo "::error::Could not read ClientVersion from version.go."
            exit 1
          fi
          if ! echo "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::ClientVersion '${version}' is not a bare semver (X.Y.Z)."
            exit 1
          fi
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: v${version}"

      # Fail before creating anything if the version was released already.
      - name: Ensure tag does not already exist
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists locally."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists on origin; bump ClientVersion in version.go first."
            exit 1
          fi

      - name: Create and push release tag
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

      - name: Create GitHub release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes "Apify Go client ${TAG}. See CHANGELOG.md for details."

      # Asks the Go module proxy to fetch the version, which lists it on pkg.go.dev.
      - name: Trigger Go module proxy indexing
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          module=$(go list -m)
          echo "Requesting ${module}@${TAG} from the Go module proxy to trigger indexing."
          # The proxy may not see the tag yet. That is not fatal, since the tag publishes the module.
          curl -fsSL "https://proxy.golang.org/${module}/@v/${TAG}.info" || \
            echo "::warning::Proxy did not return the version yet; pkg.go.dev will index it on first request."
